<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">lewis ingests reports from scanners, CI and Morse's own specification into a journal, grouped into a short list of findings</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, system-ui, sans-serif; fill: #0b0e14; }
    .n { fill: #6b7280; font-size: 13px; }
    .l { font-size: 15px; font-weight: 600; }
    .m { font-size: 14px; }
  </style>
  <rect x="0" y="0" width="860" height="300" rx="8" fill="#ffffff" stroke="#cbd5e1"/>

  <!-- sources -->
  <rect x="70" y="34" width="150" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="145" y="58" class="m" text-anchor="middle">Snyk</text>
  <rect x="70" y="80" width="150" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="145" y="104" class="m" text-anchor="middle">SonarQube</text>
  <rect x="70" y="126" width="150" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="145" y="150" class="n" text-anchor="middle">Other analysers</text>
  <rect x="70" y="172" width="150" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="145" y="196" class="m" text-anchor="middle">CI tests</text>
  <rect x="70" y="218" width="150" height="38" rx="8" fill="#fff7ed" stroke="#f4901d" stroke-width="2"/>
  <text x="145" y="242" class="m" text-anchor="middle">Specification</text>

  <!-- converge to lewis -->
  <g stroke="#6b7280" stroke-width="1.5">
    <line x1="220" y1="53" x2="326" y2="133" marker-end="url(#a)"/>
    <line x1="220" y1="99" x2="326" y2="140" marker-end="url(#a)"/>
    <line x1="220" y1="145" x2="326" y2="146" marker-end="url(#a)"/>
    <line x1="220" y1="191" x2="326" y2="151" marker-end="url(#a)"/>
    <line x1="220" y1="237" x2="326" y2="158" marker-end="url(#a)"/>
  </g>

  <rect x="330" y="115" width="110" height="60" rx="8" fill="#fff7ed" stroke="#f4901d" stroke-width="2"/>
  <text x="385" y="150" class="l" text-anchor="middle">Lewis</text>

  <line x1="445" y1="145" x2="492" y2="145" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- journal -->
  <rect x="500" y="115" width="150" height="60" rx="8" fill="#fff7ed" stroke="#f4901d" stroke-width="2"/>
  <text x="575" y="140" class="l" text-anchor="middle">Journal</text>
  <text x="575" y="160" class="n" text-anchor="middle">.morse/ in your repo</text>

  <line x1="655" y1="145" x2="692" y2="145" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- findings -->
  <rect x="700" y="85" width="130" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="765" y="112" class="l" text-anchor="middle">Findings</text>
  <g stroke="#9ca3af" stroke-width="2" stroke-linecap="round">
    <line x1="730" y1="138" x2="812" y2="138"/>
    <line x1="730" y1="162" x2="812" y2="162"/>
    <line x1="730" y1="186" x2="812" y2="186"/>
  </g>
  <text x="716" y="143" class="n">1</text>
  <text x="716" y="167" class="n">2</text>
  <text x="716" y="191" class="n">3</text>
  <text x="765" y="232" class="n" text-anchor="middle">A short list, ranked by risk</text>
</svg>
