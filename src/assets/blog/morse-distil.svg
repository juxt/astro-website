<svg viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Morse reads the codebase and distils a behavioural specification</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, system-ui, sans-serif; fill: #0b0e14; }
    .n { fill: #6b7280; font-size: 13px; }
    .l { font-size: 15px; font-weight: 600; }
  </style>
  <rect x="0" y="0" width="860" height="240" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- code card -->
  <rect x="70" y="60" width="180" height="120" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <g stroke="#9ca3af" stroke-width="2" stroke-linecap="round">
    <line x1="85" y1="82" x2="215" y2="82"/>
    <line x1="97" y1="97" x2="185" y2="97"/>
    <line x1="97" y1="112" x2="200" y2="112"/>
    <line x1="109" y1="127" x2="177" y2="127"/>
    <line x1="97" y1="142" x2="205" y2="142"/>
    <line x1="85" y1="157" x2="180" y2="157"/>
  </g>
  <text x="160" y="205" class="n" text-anchor="middle">your codebase</text>

  <line x1="255" y1="120" x2="362" y2="120" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="310" y="108" class="n" text-anchor="middle">reads</text>

  <!-- Morse -->
  <rect x="370" y="90" width="120" height="60" rx="8" fill="#fff7ed" stroke="#f4901d" stroke-width="2"/>
  <text x="430" y="126" class="l" text-anchor="middle">Morse</text>

  <line x1="495" y1="120" x2="602" y2="120" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="550" y="108" class="n" text-anchor="middle">distils</text>

  <!-- spec card -->
  <rect x="610" y="60" width="180" height="120" rx="8" fill="#fff7ed" stroke="#f4901d" stroke-width="2"/>
  <g stroke-linecap="round">
    <line x1="625" y1="85" x2="775" y2="85" stroke="#f4901d" stroke-width="3"/>
    <line x1="625" y1="107" x2="765" y2="107" stroke="#9ca3af" stroke-width="2"/>
    <line x1="625" y1="122" x2="745" y2="122" stroke="#9ca3af" stroke-width="2"/>
    <line x1="625" y1="137" x2="755" y2="137" stroke="#9ca3af" stroke-width="2"/>
    <line x1="625" y1="152" x2="725" y2="152" stroke="#9ca3af" stroke-width="2"/>
  </g>
  <text x="700" y="205" class="n" text-anchor="middle">behavioural specification</text>
</svg>
