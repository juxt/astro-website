<svg viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Morse reads the code and distils a behavioural specification</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, system-ui, sans-serif; fill: #0b0e14; }
    .n { fill: #6b7280; font-size: 13px; }
    .l { font-size: 15px; font-weight: 600; }
  </style>
  <rect x="0" y="0" width="860" height="240" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

  <rect x="70" y="85" width="180" height="70" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="160" y="126" class="l" text-anchor="middle">Code</text>

  <line x1="255" y1="120" x2="362" y2="120" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="310" y="108" class="n" text-anchor="middle">reads</text>

  <rect x="370" y="90" width="120" height="60" rx="8" fill="#fff7ed" stroke="#f4901d" stroke-width="2"/>
  <text x="430" y="126" class="l" text-anchor="middle">Morse</text>

  <line x1="495" y1="120" x2="602" y2="120" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="550" y="108" class="n" text-anchor="middle">distils</text>

  <rect x="610" y="85" width="180" height="70" rx="8" fill="#fff7ed" stroke="#f4901d" stroke-width="2"/>
  <text x="700" y="126" class="l" text-anchor="middle">Specification</text>
